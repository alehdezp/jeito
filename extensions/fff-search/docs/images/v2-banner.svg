<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="bt dd">
<title id="bt">fff search banner</title>
<desc id="dd">fff search banner: the name in large type over the tagline "Indexed at-file completion for Pi. Find the file, not the guess.", with a file-row list, a blinking caret, and a highlighted match on the right. Loops automatically.</desc>
<style>
.caret { animation: blinkA 1.2s steps(1) infinite; }
@keyframes blinkA { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
.hit { animation: hitA 2.4s ease-in-out infinite; }
@keyframes hitA { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<rect width="1200" height="260" rx="14" fill="#202725"/>
<rect width="1200" height="260" rx="14" fill="url(#dots)"/>
<rect x="8" y="8" width="1184" height="244" rx="10" fill="none" stroke="#3a4541" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="70" fill="#5c6863" font-size="13" letter-spacing="3">pi extension</text>
<text x="48" y="150" fill="#f4f1e9" font-size="46" font-weight="700" letter-spacing="-0.5">fff search</text>
<rect x="48" y="172" width="148" height="4" rx="2" fill="#80d5bd"/>
<text x="48" y="212" fill="#c1ccc6" font-size="17">Indexed at-file completion for Pi. Find the file, not the guess.</text>
<g>
<text x="796" y="140" fill="#80d5bd" font-size="44" font-weight="700" font-family="Menlo, SFMono-Regular, monospace">@</text>
<rect x="848" y="72" width="256" height="8" rx="4" fill="#3a4541"/>
