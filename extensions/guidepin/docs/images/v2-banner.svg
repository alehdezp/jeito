<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="bt dd">
<title id="bt">guidepin banner</title>
<desc id="dd">guidepin banner: the name in large type over the tagline "Reminders that ride along: append-only guidance for long sessions.", with message blocks appearing one after another on the right. Loops automatically.</desc>
<style>
.b1 { animation: appear1 3.6s ease-in-out infinite; }
.b2 { animation: appear2 3.6s ease-in-out infinite; }
.b3 { animation: appear3 3.6s ease-in-out infinite; }
@keyframes appear1 { 0%,10% { opacity: .25; } 25%,100% { opacity: 1; } }
@keyframes appear2 { 0%,35% { opacity: .25; } 50%,100% { opacity: 1; } }
@keyframes appear3 { 0%,60% { opacity: .25; } 78%,92% { opacity: 1; } 100% { opacity: .25; } }
</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<rect width="1200" height="260" rx="14" fill="#202725"/>
<rect width="1200" height="260" rx="14" fill="url(#dots)"/>
<rect x="8" y="8" width="1184" height="244" rx="10" fill="none" stroke="#3a4541" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="70" fill="#5c6863" font-size="13" letter-spacing="3">pi extension</text>
<text x="48" y="150" fill="#f4f1e9" font-size="46" font-weight="700" letter-spacing="-0.5">guidepin</text>
<rect x="48" y="172" width="148" height="4" rx="2" fill="#80d5bd"/>
<text x="48" y="212" fill="#c1ccc6" font-size="17">Reminders that ride along: append-only guidance for long sessions.</text>
<g>
<rect class="b1" x="830" y="60" width="300" height="44" rx="9" fill="#171d1f" stroke="#3a4541" stroke-width="2"/>
<rect x="846" y="74" width="200" height="6" rx="3" fill="#3a4541"/>
<rect x="846" y="88" width="150" height="6" rx="3" fill="#3a4541"/>
<rect class="b2" x="830" y="112" width="300" height="44" rx="9" fill="#171d1f" stroke="#3a4541" stroke-width="2"/>
<rect x="846" y="126" width="230" height="6" rx="3" fill="#3a4541"/>
<rect x="846" y="140" width="170" height="6" rx="3" fill="#3a4541"/>
<rect class="b3" x="830" y="164" width="300" height="44" rx="9" fill="#171d1f" stroke="#80d5bd" stroke-width="2"/>
<rect x="846" y="178" width="240" height="6" rx="3" fill="#80d5bd"/>
<rect x="846" y="192" width="190" height="6" rx="3" fill="#80d5bd"/>
