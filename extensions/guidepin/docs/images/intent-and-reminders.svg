<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="gt gd">
<title id="gt">An earlier reminder never moves</title>
<desc id="gd">Mechanism overview across two runs: an earlier request contains a user message, reminder R1 and work. The next run keeps those items byte-stable in place and appends the next user message and reminder R2. Stable placement preserves provider-readable input, and old reminders continue to occupy context. Block widths are schematic, not token counts.</desc>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<rect width="1200" height="380" rx="14" fill="#111C1C"/>
<rect width="1200" height="380" rx="14" fill="url(#dots)"/>
<rect x="8" y="8" width="1184" height="364" rx="10" fill="none" stroke="#3a4541" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="44" fill="#70E6BF" font-size="13" letter-spacing="3">MECHANISM &#183; REMINDER PLACEMENT</text>
<text x="48" y="84" fill="#EAF4EE" font-size="30" font-weight="700">An earlier reminder never moves</text>
<text x="48" y="112" fill="#A4B9B0" font-size="15">stable placement preserves provider-readable input &#8212; and the guidance accumulates.</text>
<text x="48" y="146" fill="#5c6863" font-size="12" letter-spacing="2">EARLIER REQUEST</text>
<rect x="48" y="156" width="110" height="52" rx="8" fill="#172723" stroke="#3B5D52" stroke-width="1.5"/>
<text x="103" y="187" fill="#A4B9B0" font-size="13" text-anchor="middle">user</text>
<rect x="170" y="156" width="110" height="52" rx="8" fill="#172723" stroke="#70E6BF" stroke-width="2"/>
<text x="225" y="187" fill="#70E6BF" font-size="14" font-weight="700" text-anchor="middle">R1</text>
<rect x="292" y="156" width="150" height="52" rx="8" fill="#172723" stroke="#3B5D52" stroke-width="1.5"/>
<text x="367" y="187" fill="#A4B9B0" font-size="13" text-anchor="middle">work</text>
<path d="M103 208 V252 M225 208 V252 M367 208 V252" stroke="#3B5D52" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="48" y="238" fill="#5c6863" font-size="12" letter-spacing="2">NEXT RUN</text>
<rect x="48" y="252" width="110" height="52" rx="8" fill="#172723" stroke="#3B5D52" stroke-width="1.5"/>
<text x="103" y="283" fill="#A4B9B0" font-size="13" text-anchor="middle">user</text>
<rect x="170" y="252" width="110" height="52" rx="8" fill="#172723" stroke="#70E6BF" stroke-width="2"/>
<text x="225" y="283" fill="#70E6BF" font-size="14" font-weight="700" text-anchor="middle">R1</text>
<rect x="292" y="252" width="150" height="52" rx="8" fill="#172723" stroke="#3B5D52" stroke-width="1.5"/>
<text x="367" y="283" fill="#A4B9B0" font-size="13" text-anchor="middle">work</text>
<rect x="454" y="252" width="110" height="52" rx="8" fill="#172723" stroke="#edc786" stroke-width="2"/>
<text x="509" y="283" fill="#edc786" font-size="13" text-anchor="middle">user</text>
<rect x="576" y="252" width="110" height="52" rx="8" fill="#172723" stroke="#edc786" stroke-width="2"/>
<text x="631" y="283" fill="#edc786" font-size="14" font-weight="700" text-anchor="middle">R2</text>
<text x="740" y="180" fill="#70E6BF" font-size="13">R1 stays byte-stable in place.</text>
<text x="740" y="208" fill="#edc786" font-size="13">R2 appends after the new request.</text>
<text x="740" y="236" fill="#A4B9B0" font-size="13">R1 still occupies context &#8212;</text>
<text x="740" y="256" fill="#A4B9B0" font-size="13">the cost is cumulative.</text>
<path d="M48 330 H1152" stroke="#3B5D52" stroke-width="1"/>
<text x="48" y="354" fill="#A4B9B0" font-size="14">Stable placement is the point and the price: reminders persist, so guidance grows the history it preserves.</text>
</g>
</svg>