<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="dt dd2">
<title id="dt">Sections keep their place in the tree</title>
<desc id="dd2">Causal comparison held constant except the unit of retrieval: loose chunks lose their address and offer only a similarity score, while a retrieved section arrives with its folder and heading path, authored description, validated links, and freshness from reconciliation with the current tree. Static labels carry the full explanation.</desc>
<style>
.pulse { animation: dpulse 3.4s ease-in-out infinite; }
@keyframes dpulse { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<rect width="1200" height="440" rx="14" fill="#111C1C"/>
<rect width="1200" height="440" rx="14" fill="url(#dots)"/>
<rect x="8" y="8" width="1184" height="424" rx="10" fill="none" stroke="#3a4541" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="48" fill="#70E6BF" font-size="13" letter-spacing="3">MECHANISM &#183; DOCUMENT EVIDENCE</text>
<text x="48" y="90" fill="#EAF4EE" font-size="30" font-weight="700">Sections keep their place in the tree</text>
<text x="48" y="120" fill="#A4B9B0" font-size="15">the same question, two units of retrieval &#8212; one keeps the address the answer depends on.</text>
<rect x="48" y="160" width="420" height="210" rx="10" fill="#172723" stroke="#3a4541" stroke-width="1.5"/>
<text x="70" y="192" fill="#5c6863" font-size="12" letter-spacing="2">CHUNK RETRIEVAL</text>
<rect x="78" y="216" width="230" height="26" rx="5" fill="#273A35"/>
<rect x="150" y="258" width="190" height="26" rx="5" fill="#273A35"/>
<rect x="96" y="300" width="250" height="26" rx="5" fill="#273A35"/>
<rect x="336" y="222" width="106" height="34" rx="8" fill="#172723" stroke="#edc786" stroke-width="1.5"/>
<text x="389" y="244" fill="#edc786" font-size="13" text-anchor="middle">score 0.81</text>
<text x="70" y="352" fill="#A4B9B0" font-size="13">no address &#8212; dependents unaskable</text>
<path d="M498 170 V360" stroke="#3B5D52" stroke-width="1"/>
<rect x="520" y="160" width="632" height="210" rx="10" fill="#172723" stroke="#3a4541" stroke-width="1.5"/>
<text x="544" y="196" fill="#70E6BF" font-size="14">docs/ &#8250; operations.md &#8250; Retry policy</text>
<rect x="544" y="214" width="584" height="134" rx="10" fill="#25463B" stroke="#70E6BF" stroke-width="2"/>
<text x="568" y="246" fill="#EAF4EE" font-size="17" font-weight="700">Retry policy</text>
<text x="568" y="272" fill="#A4B9B0" font-size="13">authored description &#8212; bounded retries</text>
<text x="568" y="300" fill="#70E6BF" font-size="13">code link &#8212; verified</text>
<text x="568" y="322" fill="#edc786" font-size="13">related link &#8212; ambiguous</text>
<text class="pulse" x="568" y="340" fill="#70E6BF" font-size="13">fresh &#8212; reconciled with the tree</text>
<text x="48" y="392" fill="#A4B9B0" font-size="13">classification travels with the lead: answer-bearing passage and weak lead stay distinct.</text>
<path d="M48 404 H1152" stroke="#3B5D52" stroke-width="1"/>
<text x="48" y="428" fill="#A4B9B0" font-size="14">A section knows where it lives; a chunk only knows what it resembles.</text>
</g>
</svg>