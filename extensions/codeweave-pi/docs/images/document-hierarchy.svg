<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="dt dd2">
<title id="dt">Sections keep their place in the tree</title>
<desc id="dd2">Causal comparison held constant except the unit of retrieval: loose chunks lose their address and offer only a similarity score, while a retrieved section arrives with its folder and heading path, authored title and description, validated code and related links, and a freshness chip from reconciliation with the current tree. Static labels carry the full explanation.</desc>
<style>
.prune { animation: dprune 3.2s ease-in-out infinite; }
@keyframes dprune { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .prune { animation: none; } }
</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<rect width="1200" height="440" rx="14" fill="#111C1C"/>
<rect width="1200" height="440" rx="14" fill="url(#dots)"/>
<rect x="8" y="8" width="1184" height="424" rx="10" fill="none" stroke="#3a4541" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="44" fill="#70E6BF" font-size="13" letter-spacing="3">MECHANISM &#183; DOCUMENT EVIDENCE</text>
<text x="48" y="84" fill="#EAF4EE" font-size="30" font-weight="700">Sections keep their place in the tree</text>
<text x="48" y="112" fill="#A4B9B0" font-size="15">the same question, two units of retrieval &#8212; one loses the address the answer depends on.</text>
<rect x="48" y="150" width="330" height="210" rx="10" fill="#172723" stroke="#3a4541" stroke-width="1.5"/>
<text x="64" y="178" fill="#5c6863" font-size="12" letter-spacing="2">CHUNK RETRIEVAL</text>
<rect x="72" y="200" width="180" height="22" rx="4" fill="#273A35"/>
<rect x="140" y="234" width="150" height="22" rx="4" fill="#273A35"/>
<rect x="88" y="268" width="200" height="22" rx="4" fill="#273A35"/>
<rect x="156" y="302" width="130" height="22" rx="4" fill="#273A35"/>
<rect x="268" y="212" width="86" height="30" rx="6" fill="#172723" stroke="#edc786" stroke-width="1.5"/>
<text x="311" y="232" fill="#edc786" font-size="11" text-anchor="middle">0.81</text>
<text x="64" y="344" fill="#A4B9B0" font-size="12">similar text, no address &#8212; who depends on it is unaskable</text>
<rect x="430" y="150" width="722" height="210" rx="10" fill="#172723" stroke="#3B5D52" stroke-width="1.5"/>
<text x="454" y="182" fill="#70E6BF" font-size="13">docs/ &#8250; operations.md &#8250; Retry policy</text>
<rect x="454" y="198" width="674" height="122" rx="8" fill="#25463B" stroke="#70E6BF" stroke-width="2"/>
<text x="474" y="226" fill="#EAF4EE" font-size="15" font-weight="700">Retry policy</text>
<text x="474" y="248" fill="#A4B9B0" font-size="12">authored description &#8212; bounded retries after transport failure</text>
<text x="474" y="274" fill="#70E6BF" font-size="11">code: src/tools/grep.ts &#8212; valid</text>
<text x="474" y="294" fill="#edc786" font-size="11">related: docs/setup.md &#8212; ambiguous</text>
<text x="860" y="274" fill="#70E6BF" font-size="11">reconciled with the current tree</text>
<text x="860" y="294" fill="#A4B9B0" font-size="11">stale sections are pruned, not ranked</text>
<text x="454" y="344" fill="#A4B9B0" font-size="12">the answer arrives with its address &#8212; folder, heading path, links and freshness</text>
<text x="48" y="392" fill="#A4B9B0" font-size="12">classification travels with the lead: answer-bearing passage and weak lead stay distinct &#183; a plan never outranks current code</text>
<path d="M48 406 H1152" stroke="#3B5D52" stroke-width="1"/>
<text x="48" y="430" fill="#A4B9B0" font-size="14">A section knows where it lives; a chunk only knows what it resembles.</text>
</g>
</svg>