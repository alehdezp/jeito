<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="bt dd">
<title id="bt">websift banner</title>
<desc id="dd">websift banner: the name in large type over the tagline "Read less, keep the rest: web research that keeps its sources.", with a mint scan line sweeping down a saved page on the right. Loops automatically.</desc>
<style>
.sweep { animation: sweepY 3s linear infinite; }
@keyframes sweepY { from { transform: translateY(0); } to { transform: translateY(96px); } }
.dim { animation: dimA 3s linear infinite; }
@keyframes dimA { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
</style>
