<svg xmlns="http://www.w3.org/2000/svg" width="640" height="568" viewBox="0 0 640 568" role="img" aria-labelledby="title desc">
  <title id="title">Small excerpt, larger source</title>
  <desc id="desc">One retained page contains two nested reading ranges. A solid blue outline marks the first excerpt. A larger dashed outline marks surrounding text available through an explicit later local read. The source is unchanged and no second fetch is needed. These are conceptual ranges, not a tool screenshot or a promise of complete extraction.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #F2F5F7; }
      .label { font-size: 26px; font-weight: 600; }
      .muted { fill: #A5B4C5; }
      .excerpt { fill: #A4CDFA; }
      .expanded { fill: #D3ECA6; }
    </style>
  </defs>
  <rect x="1" y="1" width="638" height="566" rx="20" fill="#0E141C" stroke="#2B3A4B" stroke-width="2"/>
  <text x="32" y="43" font-size="22" font-weight="700" letter-spacing="1.5" class="muted">SOURCE READING</text>
  <text x="32" y="88" font-size="34" font-weight="700" letter-spacing="-.6">Small excerpt, larger source</text>

  <rect x="32" y="124" width="376" height="332" rx="12" fill="#151E29" stroke="#58738F" stroke-width="1.5"/>
  <text x="56" y="169" class="label">Retained text</text>
  <path d="M56 190H384" fill="none" stroke="#2B3A4B" stroke-width="1.5"/>

  <rect x="56" y="210" width="320" height="188" rx="8" fill="none" stroke="#D3ECA6" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M88 240H330M88 358H318M88 376H292" fill="none" stroke="#A5B4C5" stroke-width="5" stroke-linecap="round"/>
  <rect x="68" y="266" width="296" height="60" rx="6" fill="#192532" stroke="#A4CDFA" stroke-width="2"/>
  <path d="M88 286H318M88 306H338" fill="none" stroke="#A4CDFA" stroke-width="5" stroke-linecap="round"/>
  <text x="56" y="436" font-size="24" class="muted">Same extracted page</text>

  <path d="M364 296H428" fill="none" stroke="#A4CDFA" stroke-width="2"/>
  <text x="444" y="286" class="label excerpt">First</text>
  <text x="444" y="318" class="label excerpt">excerpt</text>
  <path d="M376 374H428" fill="none" stroke="#D3ECA6" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="444" y="369" class="label expanded">Wider</text>
  <text x="444" y="401" class="label expanded">reading</text>

  <path d="M32 480H608" fill="none" stroke="#2B3A4B" stroke-width="1.5"/>
  <text x="32" y="514" font-size="25">Read more locally, without fetching again.</text>
  <text x="32" y="546" font-size="24" class="muted">Widening the reading is an explicit action.</text>
</svg>
