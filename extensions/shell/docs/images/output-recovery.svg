<svg xmlns="http://www.w3.org/2000/svg" width="560" height="464" viewBox="0 0 560 464" role="img" aria-labelledby="title desc">
  <title id="title">Read selectively while retaining captured evidence</title>
  <desc id="desc">Command output passes through LeanCTX handling into a captured log. Selected text goes to the agent, which can return to inspect more of that log. Details removed by LeanCTX before capture cannot be recovered from the log.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#80d5bd"/></marker>
  </defs>
  <rect width="560" height="464" rx="16" fill="#202725"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M24 27l8 7-8 7m15 0h10" fill="none" stroke="#80d5bd" stroke-width="3" stroke-linecap="round"/>
    <text x="62" y="41" fill="#c1ccc6" font-size="17" letter-spacing="1">JEITO SHELL / OUTPUT</text>
    <text x="24" y="84" fill="#f4f1e9" font-size="29" font-weight="700">Read less now. Inspect more later.</text>
    <rect x="24" y="108" width="222" height="66" rx="8" fill="#2c3431"/>
    <text x="135" y="136" text-anchor="middle" fill="#f4f1e9" font-size="20">Command output</text>
    <text x="135" y="160" text-anchor="middle" fill="#c1ccc6" font-size="18">before handling</text>
    <path d="M250 141h32" fill="none" stroke="#80d5bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="292" y="108" width="244" height="66" rx="8" fill="#2c3431"/>
    <text x="414" y="136" text-anchor="middle" fill="#f4f1e9" font-size="20">LeanCTX</text>
    <text x="414" y="160" text-anchor="middle" fill="#c1ccc6" font-size="18">command-aware handling</text>
    <path d="M414 178v22H135v24" fill="none" stroke="#80d5bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="234" width="222" height="112" rx="8" fill="#2c3431" stroke="#94a9a0" stroke-width="2"/>
    <text x="135" y="266" text-anchor="middle" fill="#f4f1e9" font-size="22" font-weight="700">Captured log</text>
    <text x="135" y="294" text-anchor="middle" fill="#c1ccc6" font-size="18">Retained locally</text>
    <text x="135" y="321" text-anchor="middle" fill="#c1ccc6" font-size="18">during the session</text>
    <path d="M250 276h32" fill="none" stroke="#80d5bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="292" y="246" width="244" height="84" rx="8" fill="#80d5bd"/>
    <text x="414" y="280" text-anchor="middle" fill="#17211d" font-size="22" font-weight="700">Selected text</text>
    <text x="414" y="308" text-anchor="middle" fill="#17211d" font-size="18">Shown to the agent</text>
    <path d="M414 334v43H135v-27" fill="none" stroke="#edc786" stroke-width="2"/>
    <path d="M129 358l6-9 6 9" fill="none" stroke="#edc786" stroke-width="2"/>
    <rect x="184" y="361" width="192" height="31" rx="5" fill="#202725"/>
    <text x="280" y="382" text-anchor="middle" fill="#edc786" font-size="19">Inspect more if needed</text>
    <text x="24" y="424" fill="#f4f1e9" font-size="19">The log retains what LeanCTX emits.</text>
    <text x="24" y="450" fill="#c1ccc6" font-size="18">Details removed before capture are not recoverable here.</text>
  </g>
</svg>
