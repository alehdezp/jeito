<svg xmlns="http://www.w3.org/2000/svg" width="560" height="556" viewBox="0 0 560 556" role="img" aria-labelledby="title desc">
  <title id="title">A soft wait ends the agent's wait, not the command</title>
  <desc id="desc">One command process runs from start to exit 0 without interruption. The agent's first call waits ten seconds, then returns the job id while the process continues. After other work, a second wait ends when the job completes rather than when its own window expires. The captured log grows for the whole process lifetime. Positions are conceptual ordering, not measured timings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26322d"/>
      <stop offset="1" stop-color="#1b2220"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303a36"/>
      <stop offset="1" stop-color="#28312e"/>
    </linearGradient>
    <linearGradient id="proc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f7a70"/>
      <stop offset="1" stop-color="#7f9c91"/>
    </linearGradient>
    <linearGradient id="live" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ae5cd"/>
      <stop offset="1" stop-color="#6fc4ab"/>
    </linearGradient>
    <linearGradient id="lead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8f0e2"/>
      <stop offset="1" stop-color="#80d5bd"/>
    </linearGradient>
    <pattern id="tape" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#5d6f68" stroke-width="3"/>
    </pattern>
    <style>
      .mark { animation: mark 3.4s ease-in-out infinite; }
      @keyframes mark { 0%, 100% { opacity: .42 } 50% { opacity: 1 } }
      .win { stroke-dasharray: 5 6; animation: win 2.2s linear infinite; }
      @keyframes win { to { stroke-dashoffset: -22 } }
      @media (prefers-reduced-motion: reduce) { .mark, .win { animation: none } }
    </style>
  </defs>
  <rect width="560" height="556" rx="16" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M24 27l8 7-8 7m15 0h10" fill="none" stroke="#80d5bd" stroke-width="3" stroke-linecap="round"/>
    <text x="62" y="41" fill="#9dc4b6" font-size="17" letter-spacing="2">shell / soft wait</text>

    <text x="24" y="80" fill="#f4f1e9" font-size="28" font-weight="700">A bounded wait, not a kill.</text>
    <text x="24" y="110" fill="#b6c2bb" font-size="17">Where the agent's wait ends, the command keeps going.</text>

    <text x="242" y="140" text-anchor="middle" fill="#edc786" font-size="11.5" letter-spacing="0.6">wait expires · 10s</text>
    <text x="536" y="140" text-anchor="end" fill="#a6e3a1" font-size="11.5" letter-spacing="0.6">exit 0 · 40s</text>

    <g fill="#8b9a93" font-size="11.5" letter-spacing="1.3" text-anchor="end">
      <text x="138" y="175">PROCESS</text>
      <text x="138" y="225">AGENT</text>
      <text x="138" y="266">LOG FILE</text>
    </g>

    <!-- lane 1: the process, one unbroken life -->
    <rect x="150" y="150" width="368" height="40" rx="7" fill="url(#proc)"/>
    <rect x="508" y="150" width="10" height="40" rx="5" fill="url(#lead)"/>
    <text x="164" y="175" fill="#16201d" font-size="14" font-weight="700">npm run build</text>
    <text x="498" y="175" text-anchor="end" fill="#16201d" font-size="12" opacity="0.68">same process · same log · same job id</text>

    <!-- lane 2: agent time, split by the call that returned early -->
    <rect x="150" y="200" width="92" height="40" rx="7" fill="#39443f"/>
    <rect class="win" x="150.75" y="200.75" width="90.5" height="38.5" rx="6.5" fill="none" stroke="#aebbb4" stroke-width="1.5"/>
    <text x="196" y="225" text-anchor="middle" fill="#dae1dc" font-size="13">wait: 10</text>
    <rect x="248" y="200" width="86" height="40" rx="7" fill="url(#live)"/>
    <text x="291" y="225" text-anchor="middle" fill="#16201d" font-size="13" font-weight="700">other work</text>
    <rect x="340" y="200" width="178" height="40" rx="7" fill="#edc786"/>
    <text x="429" y="225" text-anchor="middle" fill="#242017" font-size="13" font-weight="700">jobs · wait: 30 · delta</text>

    <!-- lane 3: capture keeps growing -->
    <rect x="150" y="250" width="368" height="22" rx="5" fill="#46554f"/>
    <rect x="150" y="250" width="368" height="22" rx="5" fill="url(#tape)" opacity="0.5"/>
    <rect x="480" y="250" width="38" height="22" rx="5" fill="#80d5bd" opacity="0.85"/>
    <text x="162" y="265" fill="#cfe0d9" font-size="11.5">output appended for the whole process lifetime</text>

    <!-- one boundary crossing every track, drawn over the lanes -->
    <g stroke-width="1.5" stroke-dasharray="4 5">
      <line class="mark" x1="242" y1="146" x2="242" y2="282" stroke="#ffe6b0"/>
      <line class="mark" x1="518" y1="146" x2="518" y2="282" stroke="#d8f3e4"/>
    </g>

    <!-- axis -->
    <line x1="150" y1="292" x2="518" y2="292" stroke="#55635d" stroke-width="1"/>
    <g stroke="#55635d" stroke-width="1">
      <line x1="150" y1="292" x2="150" y2="298"/>
      <line x1="242" y1="292" x2="242" y2="298"/>
      <line x1="334" y1="292" x2="334" y2="298"/>
      <line x1="426" y1="292" x2="426" y2="298"/>
      <line x1="518" y1="292" x2="518" y2="298"/>
    </g>
    <g fill="#7b8a83" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
      <text x="150" y="314">0s</text>
      <text x="242" y="314">10s</text>
      <text x="334" y="314">20s</text>
      <text x="426" y="314">30s</text>
      <text x="518" y="314">40s</text>
    </g>

    <!-- the race that decides what comes back -->
    <rect x="24" y="332" width="512" height="140" rx="10" fill="url(#pane)" stroke="#3d4a44"/>
    <text x="40" y="360" fill="#b6c2bb" font-size="15">Whichever arrives first decides what the call returns:</text>
    <text x="40" y="384" fill="#cdd6f4" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Promise.race([ job.done, delay(wait * 1000) ])</text>
    <rect x="40" y="398" width="480" height="30" rx="6" fill="#233029" stroke="#4d6b5c"/>
    <text x="52" y="418" fill="#a6e3a1" font-size="12.5" font-weight="700">done</text>
    <text x="94" y="418" fill="#cdd6f4" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sh-1 | EXIT 0</text>
    <text x="508" y="418" text-anchor="end" fill="#9dc4b6" font-size="12.5">output returned</text>
    <rect x="40" y="434" width="480" height="30" rx="6" fill="#332d20" stroke="#7a6738"/>
    <text x="52" y="454" fill="#edc786" font-size="12.5" font-weight="700">wait</text>
    <text x="94" y="454" fill="#cdd6f4" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sh-1 → job-3 running</text>
    <text x="508" y="454" text-anchor="end" fill="#d9c39a" font-size="12.5">job id returned; the work continues</text>

    <text x="24" y="502" fill="#f4f1e9" font-size="17.5">A soft wait bounds the agent's wait. It never signals the process.</text>
    <text x="24" y="528" fill="#9aa8a1" font-size="16">Conceptual ordering, not a timing benchmark.</text>
  </g>
</svg>
