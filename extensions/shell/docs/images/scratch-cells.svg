<svg xmlns="http://www.w3.org/2000/svg" width="560" height="656" viewBox="0 0 560 656" role="img" aria-labelledby="title desc">
  <title id="title">A multiline command becomes a reusable session cell</title>
  <desc id="desc">A multiline command is stored as a numbered cell such as sh-1 whose summary carries a subtitle from its first comment line. Four actions use it: run executes the stored source unchanged, show prints the numbered source without running it, clone makes a separately named copy, and list reports every cell. Twenty cells are held and a twenty-first drops the oldest created. Only multiline commands become cells.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26322d"/>
      <stop offset="1" stop-color="#1b2220"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303a36"/>
      <stop offset="1" stop-color="#28312e"/>
    </linearGradient>
    <linearGradient id="seen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ae5cd"/>
      <stop offset="1" stop-color="#6fc4ab"/>
    </linearGradient>
    <style>
      .cell { animation: cell 7s ease-in-out infinite; }
      @keyframes cell { 0%, 100% { opacity: .45 } 45%, 60% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .cell { animation: none; opacity: 1 } }
    </style>
  </defs>
  <rect width="560" height="656" rx="16" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M24 27l8 7-8 7m15 0h10" fill="none" stroke="#80d5bd" stroke-width="3" stroke-linecap="round"/>
    <text x="62" y="41" fill="#9dc4b6" font-size="17" letter-spacing="2">shell / scratch cells</text>

    <text x="24" y="80" fill="#f4f1e9" font-size="28" font-weight="700">Write it once. Run it by name.</text>
    <text x="24" y="110" fill="#b6c2bb" font-size="16">A multiline command is stored as a cell you can rerun unchanged.</text>

    <g fill="#8b9a93" font-size="11" letter-spacing="1.2">
      <text x="40" y="156">THE COMMAND</text>
      <text x="300" y="156">THE CELL IT CREATED</text>
    </g>
    <rect x="40" y="166" width="210" height="96" rx="8" fill="#1e2623" stroke="#3d4a44"/>
    <g fill="#cfe0d9" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="54" y="194"># baseline test</text>
      <text x="54" y="214">npm test -- --silent</text>
      <text x="54" y="234">node scripts/report.mjs</text>
    </g>
    <path d="M258 214h28m-7-5l7 5-7 5" fill="none" stroke="#80d5bd" stroke-width="2"/>
    <rect x="300" y="166" width="220" height="96" rx="8" fill="#2f3936" stroke="#5d8574"/>
    <text class="cell" x="312" y="188" fill="#9ae5cd" font-size="10.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sh-1 created · 3 lines</text>
    <text x="312" y="204" fill="#9aa8a1" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">baseline test</text>
    <g fill="#cfe0d9" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="312" y="224">1 │ # baseline test</text>
      <text x="312" y="238">2 │ npm test -- --silent</text>
      <text x="312" y="252">3 │ node scripts/report.mjs</text>
    </g>

    <rect x="24" y="292" width="512" height="180" rx="10" fill="url(#pane)" stroke="#3d4a44"/>
    <text x="40" y="316" fill="#8b9a93" font-size="12.5">Four verbs, one stored cell</text>

    <rect x="40" y="326" width="54" height="20" rx="5" fill="#2b3f39" stroke="#4d6b5c"/>
    <text x="67" y="340" text-anchor="middle" fill="#9ae5cd" font-size="11" font-weight="700">run</text>
    <text x="106" y="340" fill="#cdd6f4" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bash({ id: "sh-1", action: ["run"] })</text>
    <text x="106" y="356" fill="#9aa8a1" font-size="11.5">executes the stored source unchanged; the cell records the last status</text>

    <rect x="40" y="360" width="54" height="20" rx="5" fill="#2b3f39" stroke="#4d6b5c"/>
    <text x="67" y="374" text-anchor="middle" fill="#9ae5cd" font-size="11" font-weight="700">show</text>
    <text x="106" y="374" fill="#cdd6f4" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bash({ id: "sh-1", action: ["show"] })</text>
    <text x="106" y="390" fill="#9aa8a1" font-size="11.5">prints the numbered source; it never runs</text>

    <rect x="40" y="394" width="54" height="20" rx="5" fill="#2b3f39" stroke="#4d6b5c"/>
    <text x="67" y="408" text-anchor="middle" fill="#9ae5cd" font-size="11" font-weight="700">clone</text>
    <text x="106" y="408" fill="#cdd6f4" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bash({ id: "sh-1:sh-copy", action: ["clone"] })</text>
    <text x="106" y="424" fill="#9aa8a1" font-size="11.5">a separately named copy, recorded as cloned from sh-1</text>

    <rect x="40" y="428" width="54" height="20" rx="5" fill="#2b3f39" stroke="#4d6b5c"/>
    <text x="67" y="442" text-anchor="middle" fill="#9ae5cd" font-size="11" font-weight="700">list</text>
    <text x="106" y="442" fill="#cdd6f4" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bash({ action: ["list"] })</text>
    <text x="106" y="458" fill="#9aa8a1" font-size="11.5">id, line count, last status and subtitle for every cell</text>

    <rect x="24" y="486" width="512" height="92" rx="10" fill="url(#pane)" stroke="#3d4a44"/>
    <text x="40" y="512" fill="#b6c2bb" font-size="12.5">Cells are held to twenty. A twenty-first drops the oldest created.</text>
    <g>
      <rect x="44" y="526" width="14" height="14" rx="3" fill="none" stroke="#8a5560" stroke-width="1.2" stroke-dasharray="3 2"/>
      <rect x="64" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="84" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="104" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="124" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="144" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="164" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="184" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="204" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="224" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="244" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="264" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="284" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="304" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="324" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="344" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="364" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="384" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="404" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
      <rect x="424" y="526" width="14" height="14" rx="3" fill="url(#seen)"/>
    </g>
    <text x="44" y="556" fill="#c08b9a" font-size="10.5">dropped</text>
    <text x="106" y="556" fill="#9aa8a1" font-size="11.5">the oldest created, not the least recently used</text>

    <text x="24" y="606" fill="#f4f1e9" font-size="14.5">Only multiline commands become cells; one-liners run as they are.</text>
    <text x="24" y="632" fill="#9aa8a1" font-size="14.5">Cells are 0700 files under /tmp/jeito-shell/scripts, for this session.</text>
  </g>
</svg>
