<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="bt dd">
<title id="bt">context diagnostics banner</title>
<desc id="dd">context diagnostics banner: the name in large type over the tagline "See what Pi loaded before you blame the model.", with a mint lens gliding across a document grid on the right. Loops automatically.</desc>
<style>
.lens { animation: glideX 3.2s ease-in-out infinite; }
@keyframes glideX { 0%,100% { transform: translateX(0); } 50% { transform: translateX(140px); } }
</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<rect width="1200" height="260" rx="14" fill="#202725"/>
<rect width="1200" height="260" rx="14" fill="url(#dots)"/>
<rect x="8" y="8" width="1184" height="244" rx="10" fill="none" stroke="#3a4541" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="70" fill="#5c6863" font-size="13" letter-spacing="3">pi extension</text>
<text x="48" y="150" fill="#f4f1e9" font-size="46" font-weight="700" letter-spacing="-0.5">context diagnostics</text>
<rect x="48" y="172" width="148" height="4" rx="2" fill="#80d5bd"/>
<text x="48" y="212" fill="#c1ccc6" font-size="17">See what Pi loaded before you blame the model.</text>
<g>
<rect x="830" y="56" width="240" height="144" rx="8" fill="#171d1f" stroke="#3a4541" stroke-width="2"/>
<rect x="848" y="76" width="204" height="6" rx="3" fill="#3a4541"/>
<rect x="848" y="92" width="204" height="6" rx="3" fill="#3a4541"/>
<rect x="848" y="108" width="160" height="6" rx="3" fill="#3a4541"/>
<rect x="848" y="124" width="204" height="6" rx="3" fill="#3a4541"/>
<rect x="848" y="140" width="140" height="6" rx="3" fill="#3a4541"/>
<rect x="848" y="156" width="204" height="6" rx="3" fill="#3a4541"/>
<rect x="848" y="172" width="176" height="6" rx="3" fill="#3a4541"/>
<g class="lens">
<circle cx="878" cy="120" r="30" fill="none" stroke="#80d5bd" stroke-width="5"/>
<circle cx="878" cy="120" r="30" fill="#80d5bd" fill-opacity="0.06"/>
<line x1="900" y1="142" x2="924" y2="166" stroke="#80d5bd" stroke-width="7" stroke-linecap="round"/>
</g>
</g>
</g>
</svg>
