<svg xmlns="http://www.w3.org/2000/svg" width="640" height="648" viewBox="0 0 640 648" role="img" aria-labelledby="title desc">
<title id="title">Where a new tool's instructions enter the request</title>
<desc id="desc">An existing request contains instructions followed by conversation. Adding a tool's instructions to the beginning changes the prefix before the conversation. Stow instead keeps earlier input identical and appends the tool contract. Blue marks retained input and green marks new content. This is a placement comparison, not a token count or cache benchmark.</desc>
<defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#F2F5F7}.kicker{font-size:20px;font-weight:700;letter-spacing:1px;fill:#A5B4C5}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:600}.body{font-size:24px}.note{font-size:22px;fill:#A5B4C5}.retained{fill:#192532;stroke:#A4CDFA;stroke-width:1.5}.added{fill:#1A2926;stroke:#D3ECA6;stroke-width:1.5}.blue{fill:#A4CDFA}.green{fill:#D3ECA6}</style></defs>
<rect x="1" y="1" width="638" height="646" rx="20" fill="#0E141C" stroke="#2B3A4B"/>
<path d="M32 44V26h6v6h6v-6h6v6h6v-6h6v18l-6 6v8H38v-8Z" fill="#D3ECA6"/>
<text x="80" y="48" class="kicker">STOW-TOOLS</text>
<text x="32" y="104" class="title">Two ways to add tool instructions</text>
<text x="32" y="152" class="label">Before activation</text>
<rect x="32" y="172" width="176" height="76" rx="8" class="retained"/>
<text x="120" y="219" text-anchor="middle" class="body blue">Instructions</text>
<rect x="224" y="172" width="240" height="76" rx="8" class="retained"/>
<text x="344" y="219" text-anchor="middle" class="body blue">Conversation</text>
<text x="32" y="304" class="label">Rebuild the earlier instructions</text>
<rect x="32" y="324" width="176" height="76" rx="8" class="added"/>
<text x="120" y="354" text-anchor="middle" class="body green">Changed</text><text x="120" y="382" text-anchor="middle" class="body green">instructions</text>
<rect x="224" y="324" width="240" height="76" rx="8" class="retained"/>
<text x="344" y="354" text-anchor="middle" class="body blue">Same</text><text x="344" y="382" text-anchor="middle" class="body blue">conversation</text>
<path d="M40 414h416" stroke="#A5B4C5" stroke-width="1.5"/>
<text x="40" y="443" class="note">The prefix differs before the conversation.</text>
<text x="32" y="490" class="label">Stow: append the guide</text>
<rect x="32" y="510" width="176" height="76" rx="8" class="retained"/>
<text x="120" y="557" text-anchor="middle" class="body blue">Instructions</text>
<rect x="224" y="510" width="240" height="76" rx="8" class="retained"/>
<text x="344" y="557" text-anchor="middle" class="body blue">Conversation</text>
<rect x="480" y="510" width="128" height="76" rx="8" class="added"/>
<text x="544" y="540" text-anchor="middle" class="body green">+ tool</text><text x="544" y="568" text-anchor="middle" class="body green">guide</text>
<text x="32" y="624" class="note">Cache reuse still depends on the provider.</text>
</svg>
