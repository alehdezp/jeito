<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="tt td">
<title id="tt">Two ways to add a tool mid-session</title>
<desc id="td">Causal placement comparison: a request contains instructions followed by conversation. Rebuilding the early instructions for a new tool changes the prefix before the conversation. tooltap leaves the earlier input identical and appends the tool contract at the end. Everything except the placement is held constant. Static labels carry the full explanation; this is not a token count or cache benchmark.</desc>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<rect width="1200" height="440" rx="14" fill="#111C1C"/>
<rect width="1200" height="440" rx="14" fill="url(#dots)"/>
<rect x="8" y="8" width="1184" height="424" rx="10" fill="none" stroke="#3a4541" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="44" fill="#70E6BF" font-size="13" letter-spacing="3">MECHANISM &#183; INSTRUCTION PLACEMENT</text>
<text x="48" y="84" fill="#EAF4EE" font-size="30" font-weight="700">Two ways to add a tool mid-session</text>
<text x="48" y="112" fill="#A4B9B0" font-size="15">the comparison holds everything constant except where the new instructions enter.</text>
<text x="48" y="150" fill="#5c6863" font-size="12" letter-spacing="2">BEFORE ACTIVATION</text>
<rect x="48" y="160" width="220" height="56" rx="8" fill="#172723" stroke="#3B5D52" stroke-width="1.5"/>
<text x="158" y="193" fill="#A4B9B0" font-size="13" text-anchor="middle">instructions</text>
<rect x="284" y="160" width="340" height="56" rx="8" fill="#172723" stroke="#3B5D52" stroke-width="1.5"/>
<text x="454" y="193" fill="#A4B9B0" font-size="13" text-anchor="middle">conversation</text>
<text x="880" y="193" fill="#A4B9B0" font-size="12.5">the baseline request</text>
<text x="48" y="238" fill="#5c6863" font-size="12" letter-spacing="2">REBUILD FOR THE NEW TOOL</text>
<rect x="48" y="248" width="220" height="56" rx="8" fill="#172723" stroke="#edc786" stroke-width="2"/>
<text x="158" y="274" fill="#edc786" font-size="13" text-anchor="middle">changed</text>
<text x="158" y="293" fill="#edc786" font-size="13" text-anchor="middle">instructions</text>
<rect x="284" y="248" width="340" height="56" rx="8" fill="#172723" stroke="#3B5D52" stroke-width="1.5"/>
<text x="454" y="281" fill="#A4B9B0" font-size="13" text-anchor="middle">same conversation</text>
<text x="880" y="274" fill="#edc786" font-size="12.5">the prefix differs before</text>
<text x="880" y="293" fill="#edc786" font-size="12.5">the conversation</text>
<text x="48" y="316" fill="#5c6863" font-size="12" letter-spacing="2">TOOLTAP: APPEND THE CONTRACT</text>
<rect x="48" y="326" width="220" height="56" rx="8" fill="#172723" stroke="#3B5D52" stroke-width="1.5"/>
<text x="158" y="359" fill="#A4B9B0" font-size="13" text-anchor="middle">instructions</text>
<rect x="284" y="326" width="340" height="56" rx="8" fill="#172723" stroke="#3B5D52" stroke-width="1.5"/>
<text x="454" y="359" fill="#A4B9B0" font-size="13" text-anchor="middle">conversation</text>
<rect x="640" y="326" width="200" height="56" rx="8" fill="#172723" stroke="#edc786" stroke-width="2"/>
<text x="740" y="359" fill="#edc786" font-size="13" text-anchor="middle">+ tool contract</text>
<text x="880" y="352" fill="#70E6BF" font-size="12.5">early input stays</text>
<text x="880" y="371" fill="#70E6BF" font-size="12.5">byte-identical</text>
<path d="M48 402 H1152" stroke="#3B5D52" stroke-width="1"/>
<text x="48" y="426" fill="#A4B9B0" font-size="14">Cache reuse remains the provider&#8217;s decision; the placement makes it available.</text>
</g>
</svg>