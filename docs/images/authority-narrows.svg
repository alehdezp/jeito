<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="tb da2">
<title id="tb">Authority narrows toward the edit</title>
<desc id="da2">Mechanism overview grouped across evidence sources: current source and fail-closed exhaustive search carry authority, while relationships, document sections and human path hints remain leads. All evidence passes an edit gate requiring complete inspected lines and the file hash; after it, targets that still match land per file and changed or ambiguous targets return for review. Static labels carry the full explanation; motion is illustrative.</desc>
<style>
.flow { stroke-dasharray: 7 6; animation: flowB 2.4s linear infinite; }
@keyframes flowB { to { stroke-dashoffset: -26; } }
.gate { animation: gateB 3.2s ease-in-out infinite; }
@keyframes gateB { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .flow, .gate { animation: none; } }
</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<defs>
<marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#A4B9B0"/></marker>
<marker id="ahm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#70E6BF"/></marker>
<marker id="aha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#edc786"/></marker>
</defs>
<rect width="1200" height="400" rx="14" fill="#111C1C"/>
<rect width="1200" height="400" rx="14" fill="url(#dots)"/>
<rect x="8" y="8" width="1184" height="384" rx="10" fill="none" stroke="#3a4541" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="44" fill="#70E6BF" font-size="13" letter-spacing="3">MECHANISM &#183; EVIDENCE AUTHORITY</text>
<text x="48" y="84" fill="#EAF4EE" font-size="30" font-weight="700">Authority narrows toward the edit</text>
<text x="48" y="112" fill="#A4B9B0" font-size="15">a lead may guide the next question; only inspected current source may change.</text>
<text x="48" y="146" fill="#5c6863" font-size="12" letter-spacing="2">EVIDENCE CLASS</text>
<text x="470" y="146" fill="#5c6863" font-size="12" letter-spacing="2">GATE</text>
<text x="760" y="146" fill="#5c6863" font-size="12" letter-spacing="2">OUTCOME</text>
<rect x="48" y="156" width="372" height="42" rx="8" fill="#172723" stroke="#70E6BF" stroke-width="2"/>
<text x="64" y="174" fill="#EAF4EE" font-size="13.5">current source &#8212; settles the file</text>
<text x="404" y="191" fill="#A4B9B0" font-size="11" text-anchor="end">codeweave-pi</text>
<rect x="48" y="205" width="372" height="42" rx="8" fill="#172723" stroke="#3B5D52" stroke-width="1.5"/>
<text x="64" y="223" fill="#EAF4EE" font-size="13.5">exhaustive search &#8212; coverage, fails closed</text>
<text x="404" y="240" fill="#A4B9B0" font-size="11" text-anchor="end">codeweave-pi</text>
<rect x="48" y="254" width="372" height="42" rx="8" fill="#172723" stroke="#edc786" stroke-width="2"/>
<text x="64" y="272" fill="#EAF4EE" font-size="13.5">relationships &amp; document sections &#8212; leads</text>
<text x="404" y="289" fill="#A4B9B0" font-size="11" text-anchor="end">codeweave-pi &#183; websift</text>
<rect x="48" y="303" width="372" height="42" rx="8" fill="#172723" stroke="#edc786" stroke-width="2" stroke-dasharray="5 4"/>
<text x="64" y="321" fill="#EAF4EE" font-size="13.5">path hint &#8212; human signal, not ownership</text>
<text x="404" y="338" fill="#A4B9B0" font-size="11" text-anchor="end">fff search</text>
<path class="flow" d="M420 177 L468 232" fill="none" stroke="#70E6BF" stroke-width="2" marker-end="url(#ahm)"/>
<path d="M420 226 L468 244" fill="none" stroke="#A4B9B0" stroke-width="1.5" marker-end="url(#ahg)"/>
<path d="M420 275 L468 258" fill="none" stroke="#edc786" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aha)"/>
<path d="M420 324 L468 270" fill="none" stroke="#edc786" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aha)"/>
<rect class="gate" x="470" y="186" width="230" height="128" rx="10" fill="#25463B" stroke="#70E6BF" stroke-width="2"/>
<text x="585" y="218" fill="#70E6BF" font-size="13" letter-spacing="2" text-anchor="middle">EDIT GATE</text>
<text x="585" y="248" fill="#EAF4EE" font-size="13" text-anchor="middle">complete inspected lines</text>
<text x="585" y="270" fill="#EAF4EE" font-size="13" text-anchor="middle">file hash confirmed</text>
<text x="585" y="296" fill="#A4B9B0" font-size="11" text-anchor="middle">nothing unexamined is changed</text>
<path d="M700 232 L756 204" fill="none" stroke="#70E6BF" stroke-width="2" marker-end="url(#ahm)"/>
<path d="M700 268 L756 302" fill="none" stroke="#edc786" stroke-width="2" marker-end="url(#aha)"/>
<rect x="760" y="170" width="392" height="72" rx="8" fill="#172723" stroke="#70E6BF" stroke-width="2"/>
<text x="778" y="198" fill="#EAF4EE" font-size="15" font-weight="700">targets still match</text>
<text x="778" y="222" fill="#A4B9B0" font-size="12.5">safe work lands, per file</text>
<rect x="760" y="270" width="392" height="72" rx="8" fill="#172723" stroke="#edc786" stroke-width="2"/>
<text x="778" y="298" fill="#EAF4EE" font-size="15" font-weight="700">changed or ambiguous</text>
<text x="778" y="322" fill="#A4B9B0" font-size="12.5">returns for review &#8212; no guessing</text>
<path d="M48 352 H1152" stroke="#3B5D52" stroke-width="1"/>
<text x="48" y="376" fill="#A4B9B0" font-size="14">Discovery runs broad; mutation answers to inspected bytes.</text>
</g>
</svg>